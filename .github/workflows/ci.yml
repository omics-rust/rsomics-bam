name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Prepare hosted build storage
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          export RUSTUP_HOME="$RUNNER_TEMP/rustup-home"
          export TMPDIR="$RUNNER_TEMP/scratch"
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME" "$TMPDIR"
          printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nRUSTUP_HOME=%s\nTMPDIR=%s\n' \
            "$CARGO_HOME" "$CARGO_TARGET_DIR" "$RUSTUP_HOME" "$TMPDIR" >> "$GITHUB_ENV"
          python3 -B - <<'PY'
          import os, shutil
          from pathlib import Path
          runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert all(Path(os.environ[key]).resolve(strict=True).is_relative_to(runner)
                     for key in ('CARGO_HOME', 'CARGO_TARGET_DIR', 'RUSTUP_HOME', 'TMPDIR'))
          assert shutil.disk_usage(runner).free > 2 * 2**30
          PY

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt

      - name: Verify resolved build target
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --locked --format-version 1 > "$RUNNER_TEMP/bam-metadata.json"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / 'bam-metadata.json').read_text())
          assert Path(metadata['target_directory']).resolve() == Path(os.environ['CARGO_TARGET_DIR']).resolve()
          PY

      - name: Format
        if: matrix.target == 'linux-x86_64'
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        if: matrix.target == 'linux-x86_64'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test debug
        run: cargo test --locked --all-features

      - name: Test release
        run: cargo test --release --locked --all-features

      - name: Verify package
        if: matrix.target == 'linux-x86_64'
        run: cargo package --locked

      - name: Install samtools oracle dependencies
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y bedtools libbz2-dev libcurl4-openssl-dev liblzma-dev libssl-dev zlib1g-dev

      - name: Build samtools 1.24 oracle
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/samtools-1.24.tar.bz2"
          curl --fail --location --retry 3 \
            https://github.com/samtools/samtools/releases/download/1.24/samtools-1.24.tar.bz2 \
            --output "$archive"
          echo "89b2a440123eeaa400392ce1736e7d60ce9041843027d76819753c5a8246bfdd  $archive" \
            | shasum -a 256 --check
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/samtools-1.24"
          ./configure --without-curses
          make -j2
          echo "$RUNNER_TEMP/samtools-1.24" >> "$GITHUB_PATH"

      - name: Verify samtools oracle
        if: matrix.target == 'linux-x86_64'
        run: |
          test "$(samtools --version | sed -n '1p')" = "samtools 1.24"
          test "$(bedtools --version)" = "bedtools v2.31.1"

      - name: Test compatibility oracle
        if: matrix.target == 'linux-x86_64'
        run: |
          cargo test --locked --test ampliconclip -- --ignored
          cargo test --locked --test ampliconstats -- --ignored
          cargo test --locked --test calmd_compat -- --ignored
          cargo test --locked --test collate -- --ignored
          cargo test --locked --lib consensus::run::tests:: -- --ignored
          cargo test --locked --test consensus_compat -- --ignored
          cargo test --locked --test cat_reheader_compat
          cargo test --locked --test checksum -- --ignored
          cargo test --locked --test compat -- --ignored
          cargo test --locked --test depth -- --ignored
          cargo test --locked --test depad_compat -- --ignored
          cargo test --locked --test fastx_compat -- --ignored
          cargo test --locked --test fixmate -- --ignored
          cargo test --locked --test import_compat -- --ignored
          cargo test --locked --test markdup --test markdup_compat
          cargo test --locked --test merge -- --ignored
          cargo test --locked --test reference md_and_embedded_regions_match_samtools_1_24 -- --ignored --exact
          cargo test --locked --test reset -- --ignored
          cargo test --locked --test sort -- --ignored
          cargo test --locked --test split_compat read_group_and_integer_tag_outputs_match_samtools_1_24
          cargo test --locked --test stats -- --ignored
          cargo test --locked --test to_bed_compat -- --ignored
          cargo test --locked --test tview -- --ignored
